version: 1
prefix: "<#2FC211><bold>SkyTools</bold></#2FC211><gray> ▪ </gray>"
help:
    - "<#2FC211>SkyTools is developed by <white><bold>lukeskywlker19</bold></white>.</#2FC211>"
    - "<#2FC211>Source code is released on GitHub: <click:OPEN_URL:https://github.com/lukesky19><yellow><underlined><bold>https://github.com/lukesky19</bold></underlined></yellow></click></#2FC211>"
    - " "
    - "<#2FC211><bold>List of Commands:</bold></#2FC211>"
    - "<white>/<aqua>skytools</aqua> <yellow>help</yellow></white>"
    - "<white>/<aqua>skytools</aqua> <yellow>give build_tool <player_name></yellow></white>"
    - "<white>/<aqua>skytools</aqua> <yellow>give mob_capture_tool <player_name> [uses]</yellow></white>"
reload: "<#2FC211>The plugin has reloaded successfully.</#2FC211>"
build-tool:
    tool-given: "<#2FC211>You have been given a build tool.</#2FC211>"
    player-tool-given: "<#2FC211>Gave player <white><player></white> a build tool.</#2FC211>"
    config-error: "<red>Unable to create or update the build tool due to a configuration error.</red>"
    position-one-invalid: "<red>Position 1 is not set.</red>"
    position-two-invalid: "<red>Position 2 is not set.</red>"
    positions-different-worlds: "<red>The two positions must be set in the same world.</red>"
    material-not-set: "<red>No material selected.</red>"
    material-not-block: "<red>The material selected is not a block.</red>"
    player-lacks-materials: "<red>Your inventory doesn't contain any items of the selected material.</red>"
    world-not-allowed: "<red>The build tool is not allowed in this world.</red>"
    no-locations-found: "<red>No valid locations found to place blocks at.</red>"
    set-position-one: "<#2FC211>Set position 1 to <world> <x> <y> <z>.</#2FC211>"
    set-position-two: "<#2FC211>Set position 2 to <world> <x> <y> <z>.</#2FC211>"
    no-access: "<red>You do not have access to use the build tool here.</red>"
    build-queued: "<#2FC211>Queued block placements.</#2FC211>"
mob-capture-tool:
    tool-given: "<#2FC211>You have been given a mob capture tool.</#2FC211>"
    player-tool-given: "<#2FC211>Gave player <white><player></white> a mob capture tool.</#2FC211>"
    tool-used-up: "<dark_purple>POOF!</dark_purple> <#2FC211>Your mob capture tool ran out of uses.</#2FC211>"
    config-error: "<red>Unable to create, use, or update the mob capture tool due to a configuration error.</red>"
    world-not-allowed: "<red>The mob capture tool is not allowed in this world.</red>"
    no-access: "<red>You do not have access to use the mob capture tool here.</red>"